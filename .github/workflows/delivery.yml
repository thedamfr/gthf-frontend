name: GTHF delivery

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gthf-frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run test:delivery
      - run: npm run build
      - run: npm run test:delivery:runtime
      - run: git diff --check

  delivery:
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: application
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: thedamfr/gthf-frontend
          ref: ${{ github.sha }}
          path: deployer
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Select and publish a candidate for the local reconciler
        env:
          GH_TOKEN: ${{ github.token }}
        run: node deployer/infrastructure/delivery/ci.mjs frontend "$GITHUB_WORKSPACE/application" "$GITHUB_WORKSPACE/deployer"
      - name: Preserve the release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gthf-frontend-release-${{ github.sha }}
          path: ${{ runner.temp }}/gthf-release/
          if-no-files-found: warn
          retention-days: 30

  result:
    name: delivery-result
    if: always()
    needs: [quality, delivery]
    runs-on: ubuntu-latest
    steps:
      - name: Require all expected jobs to succeed
        env:
          QUALITY: ${{ needs.quality.result }}
          DELIVERY: ${{ needs.delivery.result }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -eu
          test "$QUALITY" = success
          if [ "$EVENT" = pull_request ] || [ "$REF" != refs/heads/main ]; then
            test "$DELIVERY" = skipped
          else
            test "$DELIVERY" = success
          fi
