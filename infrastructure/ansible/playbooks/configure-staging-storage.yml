---
- name: Install GTHF S3 credentials into the isolated staging
  hosts: all
  gather_facts: false
  become: false
  tasks:
    - name: Configure staging using the private credential file already on the server
      ansible.builtin.script:
        cmd: ../../delivery/configure-staging-storage.py
        executable: python3
      register: gthf_storage
      changed_when: (gthf_storage.stdout | from_json).changed

    - name: Show the non-secret storage destination
      ansible.builtin.debug:
        msg: "{{ gthf_storage.stdout | from_json }}"
