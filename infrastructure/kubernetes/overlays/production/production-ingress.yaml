apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gthf-production-frontend
  labels:
    app.kubernetes.io/name: gthf
    app.kubernetes.io/component: frontend
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: gthf-staging-https-redirect@kubernetescrd
spec:
  ingressClassName: public
  rules:
    - host: gthf.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gthf-frontend
                port:
                  name: http
  tls:
    - hosts:
        - gthf.fr
      secretName: gthf-production-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gthf-production-cms
  labels:
    app.kubernetes.io/name: gthf
    app.kubernetes.io/component: cms
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: gthf-staging-https-redirect@kubernetescrd
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
spec:
  ingressClassName: public
  rules:
    - host: cms.gthf.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gthf-cms
                port:
                  name: http
  tls:
    - hosts:
        - cms.gthf.fr
      secretName: gthf-production-tls
