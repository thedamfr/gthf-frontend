apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gthf-staging

resources:
  - ../../base
  - namespace.yaml
  - issuer.yaml
  - certificate.yaml
  - production-certificate.yaml
  - middleware.yaml
  - ingress.yaml
  - production-ingress.yaml

images:
  - name: gthf-postgres
    newName: gthf-postgres
    newTag: staging
  - name: gthf-cms
    newName: gthf-cms
    newTag: staging
  - name: gthf-frontend
    newName: gthf-frontend
    newTag: production

configMapGenerator:
  - name: gthf-config
    literals:
      - NODE_ENV=production
      - XDG_CONFIG_HOME=/app/.cache
      - STRAPI_TELEMETRY_DISABLED=true
      - HOST=0.0.0.0
      - PORT=1337
      - PUBLIC_URL=https://cms.gthf.fr
      - PROXY_KOA=true
      - CLIENT_URL=https://gthf.fr
      - PREVIEW_ALLOWED_ORIGINS=https://gthf.fr,https://staging.gthf.fr
      - DATABASE_CLIENT=postgres
      - DATABASE_HOST=gthf-postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=gthdf
      - DATABASE_USERNAME=gthdf
      - DATABASE_SSL=false
      - DATABASE_POOL_MIN=1
      - DATABASE_POOL_MAX=3
      - AWS_REGION=eu-west-par
      - AWS_ENDPOINT=https://s3.eu-west-par.io.cloud.ovh.net
      - AWS_BUCKET=gthdf-staging-media
      - AWS_CDN_URL=https://gthdf-staging-media.s3.eu-west-par.io.cloud.ovh.net
      - MEDIA_ALLOWED_ORIGINS=https://gthdf-staging-media.s3.eu-west-par.io.cloud.ovh.net
      - NEXT_PUBLIC_STRAPI_URL=https://cms.gthf.fr
      - NEXT_PUBLIC_SITE_URL=https://gthf.fr
      - STRAPI_MEDIA_ORIGINS=https://cellar-c2.services.clever-cloud.com,https://gthdf-staging-media.s3.eu-west-par.io.cloud.ovh.net

generatorOptions:
  disableNameSuffixHash: true

patches:
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/name=gthf
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
