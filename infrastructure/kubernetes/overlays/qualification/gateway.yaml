apiVersion: v1
kind: Service
metadata:
  name: gthf-staging-gateway
spec:
  selector:
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gthf-staging-gateway
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gthf
        app.kubernetes.io/component: gateway
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: gateway
          image: gthf-frontend:replace-me
          command: [node, /app/staging-gateway.mjs]
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: STAGING_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gthf-staging-access
                  key: password
            - name: STAGING_SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: gthf-staging-access
                  key: session-key
          readinessProbe:
            httpGet:
              path: /_gateway/health
              port: http
          livenessProbe:
            httpGet:
              path: /_gateway/health
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
