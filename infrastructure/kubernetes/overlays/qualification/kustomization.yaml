apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gthf-qualification

resources:
  - ../../base
  - namespace.yaml
  - issuer.yaml
  - certificate.yaml
  - middleware.yaml
  - ingress.yaml
  - gateway.yaml
  - network-policies.yaml

images:
  - name: gthf-postgres
    newName: gthf-postgres
    newTag: staging
  - name: gthf-cms
    newName: gthf-cms
    newTag: staging
  - name: gthf-frontend
    newName: gthf-frontend
    newTag: production

configMapGenerator:
  - name: gthf-config
    literals:
      - NODE_ENV=production
      - XDG_CONFIG_HOME=/app/.cache
      - STRAPI_TELEMETRY_DISABLED=true
      - HOST=0.0.0.0
      - PORT=1337
      - PUBLIC_URL=https://staging-cms.gthf.fr
      - PROXY_KOA=true
      - CLIENT_URL=https://staging.gthf.fr
      - PREVIEW_ALLOWED_ORIGINS=https://staging.gthf.fr
      - DATABASE_CLIENT=postgres
      - DATABASE_HOST=gthf-postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=gthdf
      - DATABASE_USERNAME=gthdf
      - DATABASE_SSL=false
      - DATABASE_POOL_MIN=1
      - DATABASE_POOL_MAX=3
      - AWS_REGION=gra
      - AWS_ENDPOINT=https://s3.gra.io.cloud.ovh.net
      - AWS_BUCKET=gthf-staging-media-bis
      - AWS_CDN_URL=https://gthf-staging-media-bis.s3.gra.io.cloud.ovh.net
      - MEDIA_ALLOWED_ORIGINS=https://gthf-staging-media-bis.s3.gra.io.cloud.ovh.net
      - STRAPI_URL=http://gthf-cms:1337
      - PUBLIC_STRAPI_URL=https://staging-cms.gthf.fr
      - SITE_URL=https://staging.gthf.fr
      - STRAPI_MEDIA_ORIGINS=https://gthf-staging-media-bis.s3.gra.io.cloud.ovh.net

generatorOptions:
  disableNameSuffixHash: true

patches:
  - target:
      kind: NetworkPolicy
      name: allow-public-ingress
    patch: |-
      - op: replace
        path: /spec/ingress
        value:
          - from:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/component: gateway
            ports:
              - protocol: TCP
                port: 3000
              - protocol: TCP
                port: 1337
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: gthf-ghcr
