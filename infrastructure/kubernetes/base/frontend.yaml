apiVersion: v1
kind: Service
metadata:
  name: gthf-frontend
  labels:
    app.kubernetes.io/name: gthf
    app.kubernetes.io/component: frontend
spec:
  ports:
    - name: http
      appProtocol: http
      port: 3000
      protocol: TCP
      targetPort: http
  selector:
    app.kubernetes.io/name: gthf
    app.kubernetes.io/component: frontend
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gthf-frontend
  labels:
    app.kubernetes.io/name: gthf
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: gthf
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gthf
        app.kubernetes.io/component: frontend
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      serviceAccountName: gthf
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: seed-next-app-cache
          image: gthf-frontend:replace-me
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - cp -R /app/.next/server/app/. /next-app-cache/
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: next-app-cache
              mountPath: /next-app-cache
      containers:
        - name: frontend
          image: gthf-frontend:replace-me
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: gthf-config
          env:
            - name: PORT
              value: "3000"
            - name: STRAPI_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gthf-secrets
                  key: STRAPI_API_TOKEN
            - name: PREVIEW_SECRET
              valueFrom:
                secretKeyRef:
                  name: gthf-secrets
                  key: PREVIEW_SECRET
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: next-app-cache
              mountPath: /app/.next/server/app
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-app-cache
          emptyDir:
            sizeLimit: 256Mi
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
