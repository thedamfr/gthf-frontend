apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gthf-postgres
  labels:
    app.kubernetes.io/name: gthf
    app.kubernetes.io/component: postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: microk8s-hostpath
---
apiVersion: v1
kind: Service
metadata:
  name: gthf-postgres
  labels:
    app.kubernetes.io/name: gthf
    app.kubernetes.io/component: postgres
spec:
  ports:
    - name: postgres
      port: 5432
      protocol: TCP
      targetPort: postgres
  selector:
    app.kubernetes.io/name: gthf
    app.kubernetes.io/component: postgres
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gthf-postgres
  labels:
    app.kubernetes.io/name: gthf
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  serviceName: gthf-postgres
  selector:
    matchLabels:
      app.kubernetes.io/name: gthf
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gthf
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      serviceAccountName: gthf
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgres
          image: gthf-postgres:staging
          imagePullPolicy: Never
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: gthdf
            - name: POSTGRES_USER
              value: gthdf
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gthf-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_INITDB_ARGS
              value: --data-checksums
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          startupProbe:
            exec:
              command: [pg_isready, --username=gthdf, --dbname=gthdf]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [pg_isready, --username=gthdf, --dbname=gthdf]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command: [pg_isready, --username=gthdf, --dbname=gthdf]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsGroup: 70
            runAsNonRoot: true
            runAsUser: 70
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: gthf-postgres
        - name: postgres-run
          emptyDir: {}
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
