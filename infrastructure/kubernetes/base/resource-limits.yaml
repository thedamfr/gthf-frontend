apiVersion: v1
kind: ResourceQuota
metadata:
  name: gthf-budget
  labels:
    app.kubernetes.io/name: gthf
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 3Gi
    limits.cpu: "8"
    limits.memory: 8Gi
    requests.storage: 4Gi
    persistentvolumeclaims: "2"
    pods: "8"
    services: "6"
    secrets: "8"
    configmaps: "8"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: gthf-defaults
  labels:
    app.kubernetes.io/name: gthf
spec:
  limits:
    - type: Container
      min:
        cpu: 10m
        memory: 32Mi
      max:
        cpu: "2"
        memory: 2Gi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
    - type: PersistentVolumeClaim
      min:
        storage: 256Mi
      max:
        storage: 4Gi
